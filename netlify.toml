[build]
  base    = "frontend"
  command = "CI=false npm ci && chmod +x node_modules/.bin/react-scripts && npm run build"
  publish = "build"

[build.environment]
  VITE_API_BASE_URL = "https://demo-restaurant-v6g2.onrender.com"
  NODE_VERSION = "18"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
